# =============================================================
# docker-compose.yml — Einsmart Local Deployment
# Migrado a PostgreSQL 16 (MongoDB eliminado)
#
# Instrucciones:
#   1. git clone https://github.com/yuriEGV/EinsmartBcknd.git
#   2. cd EinsmartBcknd && ./setup.sh   (Linux) o setup.bat (Windows)
#   3. Accede desde la LAN:  http://<IP-del-servidor>
# =============================================================

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: einsmart_postgres
    restart: always
    environment:
      POSTGRES_DB: einsmart
      POSTGRES_USER: ${PG_USER:-einsmart_pg}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-pgpass2024}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    # Puerto solo expuesto internamente en la red Docker (no al host)
    networks:
      - einsmart_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-einsmart_pg} -d einsmart"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backend API (Node.js/Express) ──────────────────────────
  backend:
    build:
      context: .                   # El backend ES este mismo repo
      dockerfile: Dockerfile
    container_name: einsmart_backend
    restart: always
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 5000
      PG_URI: postgresql://${PG_USER:-einsmart_pg}:${PG_PASSWORD:-pgpass2024}@postgres:5432/einsmart
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - einsmart_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Frontend (React/Vite → nginx) ──────────────────────────
  frontend:
    build:
      context: ../Einsmartfrntnd   # Clon hermano — el setup.sh lo clona automáticamente
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api          # nginx hace proxy /api → backend internamente
    container_name: einsmart_frontend
    restart: always
    ports:
      - "0.0.0.0:80:80"            # Accesible desde toda la LAN (HTTP)
      - "0.0.0.0:443:443"          # Accesible desde toda la LAN (HTTPS)
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - einsmart_net

# ── Volúmenes persistentes ───────────────────────────────────
volumes:
  pg_data:
    driver: local

# ── Red interna ──────────────────────────────────────────────
networks:
  einsmart_net:
    driver: bridge
