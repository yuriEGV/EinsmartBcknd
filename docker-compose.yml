# =============================================================
# docker-compose.yml — Einsmart Local Deployment
# Ubicado dentro del repo EinsmartBcknd.
#
# Instrucciones:
#   1. git clone https://github.com/yuriEGV/EinsmartBcknd.git
#   2. cd EinsmartBcknd && ./setup.sh   (Linux) o setup.bat (Windows)
#   3. Accede desde la LAN:  http://<IP-del-servidor>
# =============================================================

services:

  # ── MongoDB ────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: einsmart_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-einsmart2024}
      MONGO_INITDB_DATABASE: Einsmart
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "127.0.0.1:27017:27017"   # Solo acceso local, NO expuesto a la LAN
    networks:
      - einsmart_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Backend API (Node.js/Express) ──────────────────────────
  backend:
    build:
      context: .                   # El backend ES este mismo repo
      dockerfile: Dockerfile
    container_name: einsmart_backend
    restart: always
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_APP_USER:-einsmart_app}:${MONGO_APP_PASSWORD:-apppass2024}@mongodb:27017/einsmart?authSource=einsmart
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - einsmart_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Frontend (React/Vite → nginx) ──────────────────────────
  frontend:
    build:
      context: ../Einsmartfrntnd   # Clon hermano — el setup.sh lo clona automáticamente
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api          # nginx hace proxy /api → backend internamente
    container_name: einsmart_frontend
    restart: always
    ports:
      - "0.0.0.0:80:80"            # Accesible desde toda la LAN
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - einsmart_net

# ── Volúmenes persistentes ───────────────────────────────────
volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local

# ── Red interna ──────────────────────────────────────────────
networks:
  einsmart_net:
    driver: bridge
